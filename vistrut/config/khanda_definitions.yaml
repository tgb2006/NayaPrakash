khandas:
  - id: 1
    slug: "khanda_1_naigam"
    name_hindi: "प्रथम खंड: नैगम नय"
    root_naya: "नैगम नय"
    sanskrit_name: "Naigama Naya"
    primary_division: "द्रव्यार्थिक नय"
    tri_aspect: "ज्ञाननय"
    chapters_count: 6
    range: [1, 3] # Includes 1, 2, 3, 62, 63, 64
    core_sutra: "अनिष्पन्नेऽर्थे संकल्पमात्रग्राही नैगमः"
    agamic_definition: "जो संकल्प मात्र को विषय करता है अथवा सामान्य और विशेष दोनों को एक साथ गौण-मुख्य किए बिना ग्रहण करता है, वह नैगम नय कहलाता है।"
    philosophical_essence: "नैगम नय ज्ञाननय है क्योंकि यह बाह्य निष्पन्न वस्तु की अपेक्षा किए बिना ज्ञाता के अंतःसंकल्प और अभिप्रेत प्रयोजन को मुख्य करता है। जैसे भूत, भावि और वर्तमान नैगमनय के भेद से वस्तु का ग्रहण करना।"

  - id: 2
    slug: "khanda_2_sangrah"
    name_hindi: "द्वितीय खंड: संग्रह नय"
    root_naya: "संग्रह नय"
    sanskrit_name: "Sangraha Naya"
    primary_division: "द्रव्यार्थिक नय"
    tri_aspect: "अर्थनय"
    chapters_count: 14
    range: [4, 8] # Includes 4, 5, 6, 7, 8, 65, 66, आदि
    core_sutra: "स्वजात्यविरोधेनैक्यमुपानयन् संग्रहः"
    agamic_definition: "जो अपनी जाति के अविरोध से संपूर्ण भेदों को एक सामान्य में संगृहीत कर एकता स्थापित करता है, वह संग्रह नय कहलाता है।"
    philosophical_essence: "संग्रह नय अर्थनय है और द्रव्यदृष्टि की मुख्यता से वस्तु की जानकारी कराता है। यह भेदों की उपेक्षा करके अभेद या सामान्य सत्ता को मुख्य करता है। जैसे परसंग्रह, अपरसंग्रह, परमशुद्ध अपरसंग्रह आदि।"

  - id: 3
    slug: "khanda_3_vyavahar"
    name_hindi: "तृतीय खंड: व्यवहार नय"
    root_naya: "व्यवहार नय"
    sanskrit_name: "Vyavahara Naya"
    primary_division: "द्रव्यार्थिक नय"
    tri_aspect: "अर्थनय"
    chapters_count: 133
    range: [9, 30] # Includes 9 to 30, 44 to 54, 67 to 99, 103 to 152
    core_sutra: "संग्रहगृहीतानामर्थानां विधिपूर्वकमवहरणं व्यवहारः"
    agamic_definition: "संग्रह नय द्वारा संगृहीत अभेद पदार्थों का विधिपूर्वक भेद, विभाजन व वर्गीकरण करने वाला नय व्यवहार नय कहलाता है।"
    philosophical_essence: "व्यवहार नय द्रव्यदृष्टि की मुख्यता वाला अर्थनय है। यह सद्भूत-असद्भूत, उपचरित-अनुपचरित आदि अनन्त भेदों के द्वारा लोक-प्रवृत्ति और अध्यात्म साधना को संभव बनाता है।"

  - id: 4
    slug: "khanda_4_rjusutra"
    name_hindi: "चतुर्थ खंड: ऋजुसूत्र नय"
    root_naya: "ऋजुसूत्र नय"
    sanskrit_name: "Rjusutra Naya"
    primary_division: "पर्यायार्थिक नय"
    tri_aspect: "अर्थनय"
    chapters_count: 18
    range: [31, 40] # Includes 31 to 40, 55 to 61, 153
    core_sutra: "ऋजु प्रगुणं वर्तमानक्षणमात्रं सूत्रयति गृह्णातीति ऋजुसूत्रः"
    agamic_definition: "जो सरल अर्थात् केवल वर्तमान समयवर्ती पर्याय को ही ग्रहण करता है, वह ऋजुसूत्र नय है।"
    philosophical_essence: "ऋजुसूत्र नय अर्थनय का भेद है और पर्यायदृष्टि की मुख्यता से वस्तु का बोध कराता है। यह स्थूल-सूक्ष्म ऋजुसूत्र, नित्य-अनित्य पर्यायार्थिक आदि रूपों में वर्तमान अवस्था को उद्घाटित करता है।"

  - id: 5
    slug: "khanda_5_shabda"
    name_hindi: "पंचम खंड: शब्दनय"
    root_naya: "शब्दनय"
    sanskrit_name: "Shabda Naya"
    primary_division: "पर्यायार्थिक नय"
    tri_aspect: "शब्दनय"
    chapters_count: 8
    range: [41, 100] # Includes 41, 100, 154 to 159
    core_sutra: "लिंगसंख्याकालकारकादिभेदेन भिन्नमर्थं शंसतीति शब्दनयः"
    agamic_definition: "जो लिंग, संख्या, साधन, काल आदि के भेद से शब्द और वाच्य अर्थ में भेद का निरूपण करता है, वह शब्दनय है।"
    philosophical_essence: "शब्दनय पर्यायदृष्टि से वस्तु का बोध कराता है, किंतु यह शब्द की मुख्यता से काम करता है।"

  - id: 6
    slug: "khanda_6_samabhirudh"
    name_hindi: "षष्ठ खंड: समभिरूढ़ नय"
    root_naya: "समभिरूढ़ नय"
    sanskrit_name: "Samabhirudha Naya"
    primary_division: "पर्यायार्थिक नय"
    tri_aspect: "शब्दनय"
    chapters_count: 11
    range: [42, 101] # Includes 42, 101, 160 to 168
    core_sutra: "नानाविधेषु पर्यायशब्देष्वेकार्थवाचिष्वपि व्युत्पत्तिभेदेन भिन्नमर्थमभिरोहतीति समभिरूढ़ः"
    agamic_definition: "जो पर्यायवाची शब्दों को भी उनके व्युत्पत्ति-निमित्त भेद के आधार पर भिन्न-भिन्न अर्थों में रूढ़ करता है, वह समभिरूढ़ नय है।"
    philosophical_essence: "समभिरूढ़ नय पर्यायवाची शब्दों में भी एक अर्थ नहीं मानता; प्रत्येक शब्द अपनी स्वतंत्र व्युत्पत्तिगत विशिष्ट पर्याय को प्रकट करता है।"

  - id: 7
    slug: "khanda_7_evambhut"
    name_hindi: "सप्तम खंड: एवंभूत नय"
    root_naya: "एवंभूत नय"
    sanskrit_name: "Evambhuta Naya"
    primary_division: "पर्यायार्थिक नय"
    tri_aspect: "शब्दनय"
    chapters_count: 35
    range: [43, 102] # Includes 43, 102, 171 to 203
    core_sutra: "यथा शब्दप्रवृत्तिनिमित्तं तथाभूतमेवार्थं गृह्णातीत्येवंभूतः"
    agamic_definition: "जिस शब्द की जिस क्रिया के निमित्त से प्रवृत्ति हुई है, वस्तु जब साक्षात् उसी क्रिया में परिणत हो, तभी उसे उस शब्द का वाच्य मानने वाला नय एवंभूत नय है।"
    philosophical_essence: "यह सातों नयों में सर्वाधिक सूक्ष्म पर्यायार्थिक शब्दनय है, जो क्रिया, भाव, शून्य, अशून्य, अस्ति, नास्ति, ऊर्ध्वता सामान्य-विशेष और परमार्थ वैलक्षण्य तक का साक्षात्कार कराता है।"
