khandas:
  - id: 1
    slug: "khanda_1_naigam"
    name_hindi: "प्रथम खंड: नैगम नय"
    root_naya: "नैगम नय"
    sanskrit_name: "Naigama Naya"
    primary_division: "द्रव्यार्थिक नय"
    tri_aspect: "ज्ञाननय"
    chapters_count: 35
    range: [1, 35]
    core_sutra: "अनिष्पन्नेऽर्थे संकल्पमात्रग्राही नैगमः"
    agamic_definition: "जो संकल्प मात्र को विषय करता है अथवा सामान्य और विशेष दोनों को एक साथ गौण-मुख्य किए बिना ग्रहण करता है, वह नैगम नय कहलाता है।"
    philosophical_essence: "नैगम नय ज्ञाननय है क्योंकि यह बाह्य निष्पन्न वस्तु की अपेक्षा किए बिना ज्ञाता के अंतःसंकल्प और अभिप्रेत प्रयोजन को मुख्य करता है। जैसे चूल्हा जलाते व्यक्ति से पूछने पर वह कहता है 'भात पका रहा हूँ', जबकि उस समय केवल अग्नि प्रज्वलित हो रही है। यहाँ निष्पन्न होने वाले कार्य को संकल्प में ही मान लिया गया है।"

  - id: 2
    slug: "khanda_2_sangrah"
    name_hindi: "द्वितीय खंड: संग्रह नय"
    root_naya: "संग्रह नय"
    sanskrit_name: "Sangraha Naya"
    primary_division: "द्रव्यार्थिक नय"
    tri_aspect: "अर्थनय"
    chapters_count: 32
    range: [36, 67]
    core_sutra: "स्वजात्यविरोधेनैक्यमुपानयन् संग्रहः"
    agamic_definition: "जो अपनी जाति के अविरोध से संपूर्ण भेदों को एक सामान्य में संगृहीत कर एकता स्थापित करता है, वह संग्रह नय कहलाता है।"
    philosophical_essence: "संग्रह नय अर्थनय है और द्रव्यदृष्टि की मुख्यता से वस्तु की जानकारी कराता है। यह भेदों की उपेक्षा करके अभेद या सामान्य सत्ता को मुख्य करता है। जैसे 'सर्वं सत्' (सब सत् है) अथवा 'सभी जीव एक हैं'। यह दृष्टि विस्तार के स्थान पर समग्रता का दर्शन कराती है।"

  - id: 3
    slug: "khanda_3_vyavahar"
    name_hindi: "तृतीय खंड: व्यवहार नय"
    root_naya: "व्यवहार नय"
    sanskrit_name: "Vyavahara Naya"
    primary_division: "द्रव्यार्थिक नय"
    tri_aspect: "अर्थनय"
    chapters_count: 38
    range: [68, 105]
    core_sutra: "संग्रहगृहीतानामर्थानां विधिपूर्वकमवहरणं व्यवहारः"
    agamic_definition: "संग्रह नय द्वारा संगृहीत अभेद पदार्थों का विधिपूर्वक भेद, विभाजन व वर्गीकरण करने वाला नय व्यवहार नय कहलाता है।"
    philosophical_essence: "व्यवहार नय भी द्रव्यदृष्टि की मुख्यता वाला अर्थनय है, किंतु यह संग्रह के विपरीत भेदमूलक है। यदि केवल संग्रह रहे तो लोक-व्यवहार लुप्त हो जाएगा; अतः 'द्रव्य' कहने के बाद 'जीव और अजीव' का भेद करना व्यवहार नय का कार्य है। यह सद्भूत-असद्भूत, उपचरित-अनुपचरित आदि रूपों में लोक-प्रवृत्ति को संभव बनाता है।"

  - id: 4
    slug: "khanda_4_rjusutra"
    name_hindi: "चतुर्थ खंड: ऋजुसूत्र नय"
    root_naya: "ऋजुसूत्र नय"
    sanskrit_name: "Rjusutra Naya"
    primary_division: "पर्यायार्थिक नय"
    tri_aspect: "अर्थनय"
    chapters_count: 30
    range: [106, 135]
    core_sutra: "ऋजु प्रगुणं वर्तमानक्षणमात्रं सूत्रयति गृह्णातीति ऋजुसूत्रः"
    agamic_definition: "जो सरल अर्थात् केवल वर्तमान समयवर्ती पर्याय को ही ग्रहण करता है, अतीत और अनागत पर्यायों की उपेक्षा करता है, वह ऋजुसूत्र नय है।"
    philosophical_essence: "ऋजुसूत्र नय अर्थनय का तीसरा भेद है, किंतु यह द्रव्यदृष्टि को छोड़कर पर्यायदृष्टि की मुख्यता से वस्तु का बोध कराता है। यह अतीत को नष्ट और भविष्य को अजन्मा मानकर केवल वर्तमान क्षणिक सत्य को स्वीकार करता है। यह बौद्ध दर्शन के क्षणिकवाद का परिशोधक और यथार्थ वर्तमान का उद्घाटक है।"

  - id: 5
    slug: "khanda_5_shabda"
    name_hindi: "पंचम खंड: शब्दनय"
    root_naya: "शब्दनय"
    sanskrit_name: "Shabda Naya"
    primary_division: "पर्यायार्थिक नय"
    tri_aspect: "शब्दनय"
    chapters_count: 24
    range: [136, 159]
    core_sutra: "लिंगसंख्याकालकारकादिभेदेन भिन्नमर्थं शंसतीति शब्दनयः"
    agamic_definition: "जो लिंग, संख्या, साधन (कारक), काल आदि के भेद से शब्द और उसके वाच्य अर्थ में भेद का निरूपण करता है, वह शब्दनय है।"
    philosophical_essence: "शब्दनय पर्यायदृष्टि से वस्तु का बोध कराता है, किंतु यह अर्थ की अपेक्षा शब्द की मुख्यता से काम करता है। व्याकरण के नियमों के अनुसार यदि काल बदल जाए (जैसे 'था' और 'है'), या लिंग बदल जाए (जैसे 'तारा' पुंलिंग और 'तारका' स्त्रीलिंग), तो यह नय वस्तु की अवस्था में भी भिन्नता स्वीकार करता है।"

  - id: 6
    slug: "khanda_6_samabhirudh"
    name_hindi: "षष्ठ खंड: समभिरूढ़ नय"
    root_naya: "समभिरूढ़ नय"
    sanskrit_name: "Samabhirudha Naya"
    primary_division: "पर्यायार्थिक नय"
    tri_aspect: "शब्दनय"
    chapters_count: 22
    range: [160, 181]
    core_sutra: "नानाविधेषु पर्यायशब्देष्वेकार्थवाचिष्वपि व्युत्पत्तिभेदेन भिन्नमर्थमभिरोहतीति समभिरूढ़ः"
    agamic_definition: "जो पर्यायवाची शब्दों को भी उनके व्युत्पत्ति-निमित्त भेद के आधार पर भिन्न-भिन्न अर्थों में रूढ़ करता है, वह समभिरूढ़ नय है।"
    philosophical_essence: "शब्दनय जहाँ व्याकरण के काल-कारक भेद से भिन्नता देखता था, समभिरूढ़ नय उससे भी सूक्ष्म जाकर पर्यायवाची शब्दों (जैसे इन्द्र, शक्र, पुरन्दर) में भी एक अर्थ नहीं मानता। 'इन्द्र' का अर्थ ऐश्वर्यवान्, 'शक्र' का अर्थ सामर्थ्यवान्, और 'पुरन्दर' का अर्थ नगर-विदारक है। अतः प्रत्येक शब्द अपनी स्वतंत्र व्युत्पत्तिगत विशिष्ट पर्याय को प्रकट करता है।"

  - id: 7
    slug: "khanda_7_evambhut"
    name_hindi: "सप्तम खंड: एवंभूत नय"
    root_naya: "एवंभूत नय"
    sanskrit_name: "Evambhuta Naya"
    primary_division: "पर्यायार्थिक नय"
    tri_aspect: "शब्दनय"
    chapters_count: 22
    range: [182, 203]
    core_sutra: "यथा शब्दप्रवृत्तिनिमित्तं तथाभूतमेवार्थं गृह्णातीत्येवंभूतः"
    agamic_definition: "जिस शब्द की जिस क्रिया के निमित्त से प्रवृत्ति हुई है, वस्तु जब साक्षात् उसी क्रिया में परिणत हो, तभी उसे उस शब्द का वाच्य मानने वाला नय एवंभूत नय है।"
    philosophical_essence: "यह सातों नयों में सर्वाधिक सूक्ष्म पर्यायार्थिक शब्दनय है। यह कहता है कि 'इन्द्र' केवल तभी इन्द्र कहलाने योग्य है जब वह साक्षात् ऐश्वर्य का उपभोग कर रहा हो; 'पूजक' केवल पूजा करते समय ही पूजक है; 'श्रोता' केवल सुनते समय ही श्रोता है। अन्यथा केवल संज्ञामात्र है, वस्तु-सत्य नहीं।"
