<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<style>
@font-face {
  font-family: 'Anek Gujarati';
  src: url('../assets/fonts/AnekGujarati-Regular.ttf');
}
@font-face {
  font-family: 'Noto Sans Gujarati';
  src: url('../assets/fonts/NotoSansGujarati-Regular.ttf');
}
body {
  margin: 0; padding: 20px; background: white;
}
.test-box {
  width: 644px;
  font-family: 'Anek Gujarati', sans-serif;
  font-size: 11.5pt;
  line-height: 1.45;
  text-align: justify;
  border: 1px solid red;
  margin-bottom: 20px;
}
</style>

<body>
<div class='test-box' id='box1'>
અનંત આકાશમાં અબજો વર્ષ પૂર્વે એક તારો ભસ્મીભૂત થઈને ઓલવાઈ ગયો હોય, છતાં આજે રાત્રે તેનું કિરણ આપણી આંખ સામે એટલું જ તેજસ્વી અને જીવંત ચમકે છે. ભૌતિક રૂપે જે વીતી ચૂક્યું છે, તે જ્ઞાતાના જ્ઞાન-ફલક પર આ ક્ષણે પણ પ્રત્યક્ષ પ્રકાશમાન છે. આ જ દ્રષ્ટિ એટલે 'ભૂતનૈગમ નય'.
</div>
