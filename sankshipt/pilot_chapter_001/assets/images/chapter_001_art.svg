<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="60%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#eeeeee" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#aaaaaa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#dddddd" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#888888" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="0.8" />
    </pattern>
    <pattern id="fineHatch" width="4" height="4" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#666666" stroke-width="0.6" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect x="0" y="0" width="600" height="360" fill="#fdfdfd"/>
  
  <!-- Outer Editorial Inset Frame -->
  <rect x="8" y="8" width="584" height="344" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect x="12" y="12" width="576" height="336" fill="none" stroke="#888888" stroke-width="0.5"/>

  <!-- Left: Architectural Window Arch opening into Cosmic Night Sky -->
  <path d="M 24 336 L 24 130 Q 24 24 140 24 Q 256 24 256 130 L 256 336 Z" fill="url(#skyGrad)" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Architectural Arch Inset Line -->
  <path d="M 32 336 L 32 135 Q 32 36 140 36 Q 248 36 248 135 L 248 336" fill="none" stroke="#555555" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Night Sky Stars & Rays -->
  <!-- Main Extinct Luminous Star -->
  <circle cx="140" cy="95" r="42" fill="url(#starGlow)"/>
  
  <!-- Star Cross Rays -->
  <line x1="140" y1="40" x2="140" y2="150" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="85" y1="95" x2="195" y2="95" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="102" y1="57" x2="178" y2="133" stroke="#dddddd" stroke-width="0.9"/>
  <line x1="178" y1="57" x2="102" y2="133" stroke="#dddddd" stroke-width="0.9"/>
  <circle cx="140" cy="95" r="5" fill="#ffffff"/>
  
  <!-- Distant Stars and Constellations -->
  <circle cx="65" cy="80" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="85" cy="140" r="1.8" fill="#ffffff" opacity="0.9"/>
  <circle cx="210" cy="70" r="1.5" fill="#ffffff" opacity="0.85"/>
  <circle cx="225" cy="120" r="1.2" fill="#ffffff" opacity="0.7"/>
  <circle cx="180" cy="160" r="1.6" fill="#ffffff" opacity="0.9"/>
  <circle cx="60" cy="190" r="1.2" fill="#ffffff" opacity="0.6"/>
  <circle cx="110" cy="220" r="1.4" fill="#ffffff" opacity="0.75"/>

  <!-- Beams of Timeless Starlight Descending Across the Arch -->
  <polygon points="140,95 24,336 90,336" fill="#ffffff" opacity="0.08"/>
  <polygon points="140,95 120,336 210,336" fill="#ffffff" opacity="0.12"/>
  <polygon points="140,95 210,336 256,336" fill="#ffffff" opacity="0.06"/>

  <!-- Window Sill & Brick Texture -->
  <rect x="20" y="326" width="240" height="12" fill="#222222" stroke="#111111" stroke-width="1"/>
  <line x1="20" y1="332" x2="260" y2="332" stroke="#444444" stroke-width="0.8"/>

  <!-- Interior Wall & Setting (Right & Center) -->
  <rect x="256" y="24" width="320" height="312" fill="#f8f8f8"/>
  <rect x="256" y="24" width="320" height="312" fill="url(#fineHatch)" opacity="0.15"/>

  <!-- Classical Oil Lamp (દીપક) on Ornamental Wooden Stand -->
  <ellipse cx="330" cy="180" r="65" fill="url(#lampGlow)"/>
  
  <!-- Wooden Pillar / Table Base -->
  <rect x="312" y="250" width="36" height="86" fill="#2d2d2d" stroke="#111111" stroke-width="1.2"/>
  <path d="M 300 250 L 360 250 L 348 242 L 312 242 Z" fill="#3a3a3a" stroke="#111111" stroke-width="1"/>
  <rect x="294" y="330" width="72" height="8" fill="#1f1f1f" stroke="#111111" stroke-width="1"/>
  <!-- Pillar Hatching -->
  <line x1="320" y1="250" x2="320" y2="330" stroke="#555555" stroke-width="0.8"/>
  <line x1="340" y1="250" x2="340" y2="330" stroke="#555555" stroke-width="0.8"/>

  <!-- Deepam / Brass Lamp Vessel -->
  <path d="M 314 242 C 314 230 346 230 346 242 Z" fill="#222222" stroke="#111111" stroke-width="1.2"/>
  <path d="M 310 230 Q 330 238 350 230 Q 364 212 344 208 Q 330 216 316 208 Q 298 214 310 230 Z" fill="#333333" stroke="#111111" stroke-width="1.2"/>
  <!-- Spout -->
  <path d="M 344 208 Q 354 198 358 190 Q 350 196 340 204 Z" fill="#111111"/>
  <!-- Golden Flame (Grayscale) -->
  <path d="M 358 190 Q 366 172 360 156 Q 352 170 354 184 Z" fill="#ffffff" stroke="#222222" stroke-width="1"/>
  <path d="M 357 186 Q 362 174 359 164 Q 354 172 355 182 Z" fill="#ffffff"/>
  <circle cx="359" cy="172" r="1.5" fill="#222222"/>

  <!-- Figures: Elder (Grandfather) and Son (Father) in Silhouette / Engraving Style -->
  <!-- Father (Sitting bent, head down in sorrow, contemplation) -->
  <!-- Body / Kurta -->
  <path d="M 460 336 C 460 280 440 260 410 250 C 400 246 390 260 380 270 C 375 285 370 310 370 336 Z" fill="#444444" stroke="#111111" stroke-width="1.5"/>
  <path d="M 460 336 C 460 280 440 260 410 250 C 400 246 390 260 380 270" fill="url(#hatch)" opacity="0.5"/>
  <!-- Father's Head bowed -->
  <circle cx="395" cy="226" r="18" fill="#333333" stroke="#111111" stroke-width="1.5"/>
  <path d="M 382 224 Q 395 210 408 220 Q 398 238 384 230 Z" fill="#222222"/>
  <!-- Folded arm resting on knee -->
  <path d="M 380 270 Q 365 280 355 300 Q 370 305 385 295 Z" fill="#333333" stroke="#111111" stroke-width="1.2"/>

  <!-- Grandfather (Standing tall, dignified, placing gentle hand on Father's shoulder) -->
  <!-- Grandfather Shawl / Angavastra -->
  <path d="M 490 336 L 490 190 Q 480 150 445 150 Q 435 150 425 160 L 425 210 Q 440 220 450 250 L 450 336 Z" fill="#222222" stroke="#111111" stroke-width="1.5"/>
  <!-- Shawl drape lines -->
  <path d="M 445 150 Q 460 190 450 260" fill="none" stroke="#777777" stroke-width="1"/>
  <path d="M 435 180 Q 470 210 465 290" fill="none" stroke="#666666" stroke-width="1"/>
  <!-- Grandfather's Dignified Head & Beard -->
  <circle cx="445" cy="125" r="19" fill="#444444" stroke="#111111" stroke-width="1.5"/>
  <!-- Traditional Headwrap / Pheta hint -->
  <path d="M 430 118 Q 446 100 464 114 Q 450 110 430 118 Z" fill="#1a1a1a"/>
  <!-- Flowing white/gray beard in engraving lines -->
  <path d="M 432 130 Q 425 152 435 162 Q 445 155 450 138 Z" fill="#eeeeee" stroke="#333333" stroke-width="1"/>
  <line x1="433" y1="135" x2="432" y2="155" stroke="#999999" stroke-width="0.8"/>
  <line x1="437" y1="135" x2="436" y2="158" stroke="#999999" stroke-width="0.8"/>
  
  <!-- Reassuring Hand Placed with Deep Compassion on the Son's Shoulder -->
  <path d="M 435 190 Q 418 200 408 235 L 416 240 Q 425 210 442 198 Z" fill="#3a3a3a" stroke="#111111" stroke-width="1.2"/>
  <!-- The Hand palm & fingers resting softly on shoulder -->
  <path d="M 406 235 C 402 238 398 245 404 250 C 410 252 416 248 418 240 Z" fill="#eeeeee" stroke="#111111" stroke-width="1"/>
  
  <!-- Floor line -->
  <line x1="12" y1="336" x2="588" y2="336" stroke="#222222" stroke-width="1.5"/>
  <rect x="12" y="336" width="576" height="12" fill="#e5e5e5"/>
  
  <!-- Sanskrit Agam Watermark Quote / Subtitle Ornament -->
  <text x="300" y="322" font-family="'Noto Sans Gujarati', sans-serif" font-size="11" fill="#444444" text-anchor="middle" letter-spacing="1">
    અતીતનો ઉપકાર અને વર્તમાનનો વિવેક — ઓલવાયેલા દીવાનું અમૃત-તેજ
  </text>
</svg>
