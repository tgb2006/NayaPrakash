book:
  title: "નય પ્રકાશ: જૈન દર્શનના ૨૦૩ નયોનું સમગ્ર અનુશીલન (સંક્ષિપ્ત ૨-પેજ આવૃત્તિ)"
  subtitle: "સપ્ત મૂળ નયોના આલોકમાં ૨૦૩ નયોનું આબાલગોપાલ સુબોધ વિવેચન, કાવ્ય, પ્રસંગ (પિપાસા-પાન) અને વિવેક (એકાંત-અનેકાંત) સભર ૨-પેજ સંસ્કરણ"
  edition_type: "sankshipt_2page_a5"
  language: "gu"
  total_khandas: 7
  total_chapters: 203
  page_spread: "A5_two_facing_pages"

framework:
  primary_divisions:
    - name: "દ્રવ્યાર્થિક નય"
      type: "Dravyarthika"
      khandas: [1, 2, 3]
    - name: "પર્યાયાર્થિક નય"
      type: "Paryayarthika"
      khandas: [4, 5, 6, 7]

  tri_aspects:
    - name: "જ્ઞાનનય"
      scope: "સંકલ્પ માત્રગ્રાહી (નૈગમ)"
      khandas: [1]
    - name: "અર્થનય"
      scope: "પદાર્થગ્રાહી (સંગ્રહ, વ્યવહાર, ઋજુસૂત્ર)"
      khandas: [2, 3, 4]
    - name: "શબ્દનય"
      scope: "શબ્દ-વ્યુત્પત્તિ-ક્રિયાગ્રાહી (શબ્દ, સમભિરૂઢ, એવંભૂત)"
      khandas: [5, 6, 7]

chapter_spec:
  format: "two_page_spread"
  left_page:
    name: "પ્રથમ પૃષ્ઠ (સંપૂર્ણ વિવેચન અને કાવ્યાત્મક બોધસૂત્ર)"
    sections:
      1: "નય વિવેચન (આબાલગોપાલ સુબોધ, રોચક શૈલી, સુંદર ઉપ-વિભાજનો સાથે વિસ્તૃત: ~૨૪૦-૨૭૦ શબ્દો)"
      2: "કાવ્યાત્મક બોધસૂત્ર (નયનું સ્વરૂપ અને સાધના સંકેત બંને વણી લેતી ૨ પંક્તિની કવિતા/દોહરો: ~૨૦-૨૫ શબ્દો)"
    word_count_target: 280
    word_count_min: 230
    word_count_max: 320
  right_page:
    name: "દ્વિતીય પૃષ્ઠ (પ્રસંગ અને વિવેક-દર્શન)"
    sections:
      3: "પ્રસંગ: પિપાસા અને પાન (૫૦-૬૦% ભાગ: પિપાસામાં મૂંઝવણ/વલયો, પાનમાં નય-દ્રષ્ટિથી સમાધાન/વિશ્રામ)"
      4: "એકાંત દર્શન (૨૦% ભાગ: જડતા/કદાગ્રહ/જીદ બને ત્યારે થતી હાનિ અને સંકુચિતતા)"
      5: "અનેકાંત દર્શન (૨૦% ભાગ: યાત્રા/સમન્વય/મંઝિલગામી બનતાં પ્રગટતું અદ્ભુત સૌંદર્ય)"
    word_count_target: 300
    word_count_min: 250
    word_count_max: 340

  word_count_targets:
    chapter_total_min: 500
    chapter_total_target: 580
    chapter_total_max: 660

guidelines:
  examples:
    count_per_chapter: 1
    style: "pipasa_paan_story"
    uniqueness: "strictly_global_across_all_203_chapters"
    ethical_filter: "strict_jain_ahimsa_compliance"
    prohibited_themes:
      - "glorification of butchery / slaughterhouses / meat trade"
      - "hunting / violence towards living beings"
      - "deceptive / fraudulent business practices portrayed positively"
      - "intoxication / gambling / immoral conduct portrayed as ideal"
