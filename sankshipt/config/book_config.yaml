book:
  title: "રસપાન"
  subtitle: "નયનું જ્ઞાન, નિર્વાણનું પાન"
  edition_type: "sankshipt_2page_a5"
  language: "gu"
  total_khandas: 7
  total_chapters: 203
  page_spread: "A5_two_facing_pages"

framework:
  primary_divisions:
    - name: "દ્રવ્યાર્થિક નય"
      type: "Dravyarthika"
      khandas: [1, 2, 3]
    - name: "પર્યાયાર્થિક નય"
      type: "Paryayarthika"
      khandas: [4, 5, 6, 7]

  tri_aspects:
    - name: "જ્ઞાનનય"
      scope: "સંકલ્પ માત્રગ્રાહી (નૈગમ)"
      khandas: [1]
    - name: "અર્થનય"
      scope: "પદાર્થગ્રાહી (સંગ્રહ, વ્યવહાર, ઋજુસૂત્ર)"
      khandas: [2, 3, 4]
    - name: "શબ્દનય"
      scope: "શબ્દ-વ્યુત્પત્તિ-ક્રિયાગ્રાહી (શબ્દ, સમભિરૂઢ, એવંભૂત)"
      khandas: [5, 6, 7]

chapter_spec:
  format: "two_page_spread"
  left_page:
    name: "પ્રથમ પૃષ્ઠ (તત્વધારા અને કાવ્યધારા)"
    sections:
      1: "તત્વધારા (સંપૂર્ણ વિવેચન: રૂપક-દ્રષ્ટિ, સ્વરૂપ-સૃષ્ટિ, વ્યવહાર-પૃષ્ટિ, મર્મ-તુષ્ટિ: ~૨૪૦-૨૭૦ શબ્દો)"
      2: "કાવ્યધારા (નયનું સ્વરૂપ રજૂ કરતી ૨ પંક્તિનો ગેય દોહરો: ~૨૦-૨૫ શબ્દો)"
    word_count_target: 280
    word_count_min: 230
    word_count_max: 320
  right_page:
    name: "દ્વિતીય પૃષ્ઠ (કથાધારા અને વિવેકધારા)"
    sections:
      3: "કથાધારા: [વાર્તા શીર્ષક] (૫૦-૬૦% ભાગ: પિપાસા અને પાન: ~૧૫૦-૧૮૦ શબ્દો)"
      4: "વિવેકધારા (૪૦% ભાગ: એકાંત દર્શન અને અનેકાંત દર્શન: ~૧૧૦-૧૩૦ શબ્દો)"
    word_count_target: 300
    word_count_min: 250
    word_count_max: 340

  word_count_targets:
    chapter_total_min: 500
    chapter_total_target: 580
    chapter_total_max: 660

guidelines:
  examples:
    count_per_chapter: 1
    style: "pipasa_paan_story"
    uniqueness: "strictly_global_across_all_203_chapters"
    ethical_filter: "strict_jain_ahimsa_compliance"
    prohibited_themes:
      - "glorification of butchery / slaughterhouses / meat trade"
      - "hunting / violence towards living beings"
      - "deceptive / fraudulent business practices portrayed positively"
      - "intoxication / gambling / immoral conduct portrayed as ideal"
